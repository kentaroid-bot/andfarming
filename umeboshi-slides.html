<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>梅干し作り 3工程スライド</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
      :root {
        --paper: #fffaf0;
        --cream: #f7ead2;
        --ink: #352d29;
        --muted: #75695f;
        --accent: #91483e;
        --ruby: #b94a4c;
        --line: rgba(80, 55, 40, 0.18);
        --shadow: rgba(63, 42, 29, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 16%, rgba(231, 179, 75, 0.18), transparent 28%),
          linear-gradient(135deg, #fffdf7 0%, #f8ead4 100%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans",
          "Yu Gothic", sans-serif;
      }

      button {
        font: inherit;
      }

      .app {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(18px, 4vw, 48px);
      }

      .deck {
        width: min(1180px, 100%);
      }

      .slide {
        min-height: min(720px, calc(100svh - 128px));
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
        gap: clamp(28px, 5vw, 62px);
        align-items: center;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: clamp(28px, 5vw, 58px);
        background: rgba(255, 253, 247, 0.9);
        box-shadow: 0 22px 70px var(--shadow);
      }

      .image-panel {
        position: relative;
        min-height: 520px;
        display: grid;
        place-items: center;
      }

      .image-panel::before {
        content: "";
        position: absolute;
        inset: 9% 6% 7%;
        border-radius: 50%;
        background: var(--cream);
      }

      .slide-image {
        position: relative;
        width: min(100%, 430px);
        max-height: 620px;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 16px 44px rgba(80, 55, 40, 0.18);
      }

      .content {
        max-width: 560px;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1 {
        margin: 0 0 22px;
        font-size: clamp(42px, 6vw, 78px);
        line-height: 1.04;
        letter-spacing: 0;
      }

      .lead {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: clamp(17px, 2vw, 22px);
        line-height: 1.75;
      }

      .points {
        display: grid;
        gap: 12px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .points li {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 12px;
        align-items: start;
        color: var(--ink);
        font-size: clamp(15px, 1.55vw, 18px);
        line-height: 1.6;
      }

      .points span {
        width: 34px;
        height: 34px;
        display: inline-grid;
        place-items: center;
        border-radius: 50%;
        background: var(--ruby);
        color: #fffaf0;
        font-size: 14px;
        font-weight: 800;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-top: 18px;
      }

      .nav-button {
        min-width: 110px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 11px 16px;
        background: rgba(255, 250, 240, 0.82);
        color: var(--ink);
        cursor: pointer;
        font-weight: 800;
      }

      .nav-button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .dots {
        display: flex;
        gap: 9px;
        align-items: center;
      }

      .dot {
        width: 13px;
        height: 13px;
        border: 0;
        border-radius: 999px;
        padding: 0;
        background: rgba(145, 72, 62, 0.28);
        cursor: pointer;
      }

      .dot.active {
        width: 34px;
        background: var(--accent);
      }

      .page-count {
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
      }

      @media (max-width: 820px) {
        .app {
          padding: 12px;
        }

        .slide {
          min-height: auto;
          grid-template-columns: 1fr;
          gap: 18px;
          padding: 22px;
        }

        .image-panel {
          min-height: 320px;
        }

        .slide-image {
          width: min(100%, 330px);
          max-height: 390px;
        }

        h1 {
          font-size: clamp(36px, 11vw, 52px);
        }

        .controls {
          margin-top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const { useEffect, useMemo, useState } = React;

      const slides = [
        {
          title: "丁寧な下準備",
          image: "output/images/slides/umeboshi_prep.png",
          lead:
            "完熟梅を選び、水気をしっかり拭き取り、竹串でヘタを外します。カビを防ぐための土台になる工程です。",
          points: [
            "傷んだ梅を取り除き、青みが残る梅は短時間だけアク抜きする。",
            "ヘタのくぼみまで一粒ずつ乾かし、水分を残さない。",
            "作業前に手と道具を清潔にして、焼酎で軽く消毒する。",
          ],
        },
        {
          title: "塩漬けと赤しそ",
          image: "output/images/slides/umeboshi_shiso.png",
          lead:
            "粗塩と砂糖を合わせて梅にまぶし、梅酢を上げます。赤しそを加えると、鮮やかな色と香りが移ります。",
          points: [
            "粗塩100〜200gに砂糖を足し、合計200gになるように用意する。",
            "梅が梅酢に浸かるまで、毎日やさしく容器を揺すってなじませる。",
            "赤しそは塩で揉んでアクを抜き、梅酢で発色させてから加える。",
          ],
        },
        {
          title: "三日三晩の土用干し",
          image: "output/images/slides/umeboshi_drying.png",
          lead:
            "梅雨明け後、晴天が続く日にザルへ並べて干します。日差しと夜露で、皮がふっくらやわらかく仕上がります。",
          points: [
            "1日目は日中に干し、夕方に梅酢へ戻して皮をやわらかくする。",
            "2日目は再び干し、夕方は梅酢に戻さず室内へ取り込む。",
            "3日目は夜露に当て、翌朝ぽってりやわらかければ完成。",
          ],
        },
      ];

      function App() {
        const [index, setIndex] = useState(0);
        const slide = slides[index];

        const pageLabel = useMemo(
          () => `${index + 1} / ${slides.length}`,
          [index]
        );

        useEffect(() => {
          const handleKey = (event) => {
            if (event.key === "ArrowRight") {
              setIndex((current) => Math.min(current + 1, slides.length - 1));
            }
            if (event.key === "ArrowLeft") {
              setIndex((current) => Math.max(current - 1, 0));
            }
          };

          window.addEventListener("keydown", handleKey);
          return () => window.removeEventListener("keydown", handleKey);
        }, []);

        return React.createElement(
          "main",
          { className: "app" },
          React.createElement(
            "div",
            { className: "deck" },
            React.createElement(
              "section",
              { className: "slide", "aria-live": "polite" },
              React.createElement(
                "div",
                { className: "image-panel" },
                React.createElement("img", {
                  className: "slide-image",
                  src: slide.image,
                  alt: `${slide.title}の水彩イラスト`,
                })
              ),
              React.createElement(
                "div",
                { className: "content" },
                React.createElement("p", { className: "eyebrow" }, "梅干し作り 3工程"),
                React.createElement("h1", null, slide.title),
                React.createElement("p", { className: "lead" }, slide.lead),
                React.createElement(
                  "ul",
                  { className: "points" },
                  slide.points.map((point, pointIndex) =>
                    React.createElement(
                      "li",
                      { key: point },
                      React.createElement("span", null, pointIndex + 1),
                      point
                    )
                  )
                )
              )
            ),
            React.createElement(
              "nav",
              { className: "controls", "aria-label": "スライド操作" },
              React.createElement(
                "button",
                {
                  className: "nav-button",
                  type: "button",
                  disabled: index === 0,
                  onClick: () => setIndex((current) => Math.max(current - 1, 0)),
                },
                "前へ"
              ),
              React.createElement(
                "div",
                { className: "dots", "aria-label": pageLabel },
                slides.map((item, dotIndex) =>
                  React.createElement("button", {
                    key: item.title,
                    className: `dot${dotIndex === index ? " active" : ""}`,
                    type: "button",
                    "aria-label": `${dotIndex + 1}ページ目: ${item.title}`,
                    onClick: () => setIndex(dotIndex),
                  })
                )
              ),
              React.createElement("span", { className: "page-count" }, pageLabel),
              React.createElement(
                "button",
                {
                  className: "nav-button",
                  type: "button",
                  disabled: index === slides.length - 1,
                  onClick: () =>
                    setIndex((current) => Math.min(current + 1, slides.length - 1)),
                },
                "次へ"
              )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(App)
      );
    </script>
  </body>
</html>
